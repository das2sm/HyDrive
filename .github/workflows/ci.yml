name: Artifact verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-analysis.txt

      - name: Verify artifact
        run: python analysis/verify_artifact.py

      - name: Run release tests
        run: pytest -q

      - name: Recompute all bootstrap intervals
        run: python analysis/verify_artifact.py --full-bootstrap
